id: 8a1f2c30-0002-4d5e-9b21-0a1b2c3d4e02
name: Impossible travel between successful sign-ins
description: >
  Flags a user with two successful sign-ins from different countries within a
  short window that is physically implausible to travel — a strong indicator of
  credential compromise or token theft.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs]
queryFrequency: 1h
queryPeriod: 6h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  SigninLogs
  | where ResultType == "0"
  | extend Country = tostring(LocationDetails.countryOrRegion),
           City    = tostring(LocationDetails.city)
  | where isnotempty(Country)
  | project TimeGenerated, UserPrincipalName, IPAddress, Country, City
  | order by UserPrincipalName asc, TimeGenerated asc
  | serialize
  | extend PrevUser = prev(UserPrincipalName),
           PrevCountry = prev(Country),
           PrevTime = prev(TimeGenerated),
           PrevIP = prev(IPAddress)
  | where UserPrincipalName == PrevUser
      and Country != PrevCountry
      and datetime_diff('minute', TimeGenerated, PrevTime) <= 60
  | project TimeGenerated, UserPrincipalName,
            FromCountry = PrevCountry, FromIP = PrevIP,
            ToCountry = Country, ToIP = IPAddress,
            MinutesApart = datetime_diff('minute', TimeGenerated, PrevTime)
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
tuning: >
  Allow-list corporate VPN egress countries and known cloud-provider IP ranges
  (mail clients often appear in datacenter regions). Consider Identity Protection's
  native risk detections as a higher-fidelity complement.
