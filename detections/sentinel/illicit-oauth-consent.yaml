id: 8a1f2c30-0003-4d5e-9b21-0a1b2c3d4e03
name: Illicit OAuth application consent grant
description: >
  Detects a user granting consent to an OAuth application — the core of consent-
  phishing (illicit consent grant) attacks that persist access without a password.
  Prioritizes newly registered or non-verified publishers.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [AuditLogs]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - CredentialAccess
relevantTechniques:
  - T1528
query: |
  AuditLogs
  | where OperationName in ("Consent to application", "Add delegated permission grant")
  | extend App = tostring(TargetResources[0].displayName)
  | extend InitiatedBy = tostring(InitiatedBy.user.userPrincipalName)
  | mv-apply prop = ModifiedProperties on (
      where tostring(prop.displayName) == "ConsentAction.Permissions"
      | extend Permissions = tostring(prop.newValue)
    )
  | where Permissions has_any ("Mail.Read", "Mail.ReadWrite", "Mail.Send",
                               "Files.ReadWrite.All", "offline_access", "Directory.ReadWrite.All")
  | project TimeGenerated, InitiatedBy, App, Permissions, Result
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: InitiatedBy
tuning: >
  Allow-list your approved enterprise apps. Restrict user consent in Entra to
  "verified publishers, limited permissions" so this fires only on exceptions.
  On a true positive, revoke the grant and run the compromised-account playbook.
